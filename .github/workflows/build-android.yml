name: Compilar APK del widget Android

# Compila widget-android/ y publica el APK en la release `android-widget`, con un link fijo:
#   https://github.com/Ignacio-81/commission-tracker/releases/download/android-widget/wallet-path-widget.apk
# No toca la web (el deploy de Pages es otro workflow).

on:
  push:
    branches: [main]
    paths:
      - "widget-android/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar APK
        run: gradle -p widget-android assembleDebug --no-daemon --stacktrace

      - name: Publicar en la release android-widget
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp widget-android/app/build/outputs/apk/debug/app-debug.apk wallet-path-widget.apk
          if ! gh release view android-widget >/dev/null 2>&1; then
            gh release create android-widget --title "Widget Android" \
              --notes "APK del widget de tasas USD→ARS. Se actualiza en cada cambio de widget-android/." \
              --target "${GITHUB_SHA}"
          fi
          gh release upload android-widget wallet-path-widget.apk --clobber
